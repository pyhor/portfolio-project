<html lang="en" data-theme="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="pyhor — cinematic developer portfolio with WebGL, motion design, and live GitHub data. Fully static for GitHub Pages."

      ;(function () {
        var theme = localStorage.getItem('theme') || 'dark'

      })()
    </script>
  </head>
