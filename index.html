    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="pyhor — business, systems, and frontend development. Explore practical projects, system thinking, quality assurance, and a little creative engineering."
    />
    <meta name="theme-color" content="#101820" />
    <link rel="preload" href="%BASE_URL%fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      ;(function () {
        var stored = localStorage.getItem('theme')
        var theme = stored === 'dark' || stored === 'light' ? stored : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#101820' : '#f5f7fa')
      })()
    </script>
  </head>
